<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eventra — Markets</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="bg-glow bg-glow-1" aria-hidden="true"></div>
<div class="bg-glow bg-glow-2" aria-hidden="true"></div>

<header class="site-header">
  <nav class="nav">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      Eventra
    </a>
    <div class="nav-actions">
      <a id="nav-admin-link" class="btn btn-ghost" href="admin.html" style="display:none;">Admin</a>
      <span id="nav-auth">
        <a class="btn btn-ghost" href="login.html">Log in</a>
        <a class="btn btn-primary" href="signup.html">Sign up</a>
      </span>
      <a id="nav-user" href="account.html" class="nav-user-chip" style="display:none;" aria-label="Your account">
        <span class="nav-balance" id="nav-balance">$—</span>
        <span class="nav-avatar-pill" id="nav-avatar">?</span>
        <span class="nav-display-name" id="nav-display-name"></span>
      </a>
    </div>
  </nav>
</header>

<div class="cat-bar">
  <div class="cat-bar-inner">
    <div class="cat-tab active"    onclick="filterCat('all',this,null)">All markets</div>
    <div class="cat-tab" onclick="filterCat('ccny',this,null)">CCNY</div>
    <div class="cat-tab" onclick="filterCat('sports',this,null)">Sports</div>
    <div class="cat-tab" onclick="filterCat('politics',this,null)">Politics</div>
  </div>
</div>

<div class="page-layout">

  <aside class="sidebar">
    <div class="sidebar-title">Browse</div>
    <div class="sidebar-link active" onclick="filterCat('all',null,this)">All markets</div>
    <div class="sidebar-link" onclick="filterCat('ccny',null,this)">CCNY</div>
    <div class="sidebar-link" onclick="filterCat('sports',null,this)">Sports</div>
    <div class="sidebar-link" onclick="filterCat('politics',null,this)">Politics</div>
  </aside>

  <main class="feed">

    <!-- My Positions (shown only when signed in with open positions) -->
    <div id="positions-section" style="display:none;" class="feed-section">
      <div class="feed-section-title">My Positions</div>
      <div id="positions-list"></div>
    </div>

    <!-- Dynamic market cards injected here -->
    <div id="markets-feed">
      <p class="markets-loading">Loading markets&hellip;</p>
    </div>

  </main>
</div>

<!-- Trade Modal -->
<div id="trade-modal" class="trade-modal-overlay" style="display:none;" role="dialog" aria-modal="true">
  <div class="trade-modal-card">
    <div class="trade-modal-header">
      <div class="trade-modal-title" id="modal-market-title">Market</div>
      <button class="trade-modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    </div>

    <div class="trade-modal-meta">
      <span class="modal-side-badge" id="modal-side">YES</span>
      <span class="modal-price-label" id="modal-price">$0.00 per share</span>
    </div>

    <div class="trade-modal-balance">
      Balance: <strong id="modal-user-balance">$—</strong>
    </div>

    <div class="trade-modal-field">
      <label for="modal-shares">Shares</label>
      <input type="number" id="modal-shares" min="1" value="1" />
    </div>

    <div class="trade-modal-cost">
      Total cost: <strong id="modal-cost">$0.00</strong>
    </div>

    <button class="trade-modal-buy-btn" id="modal-buy-btn">Buy</button>
    <div class="modal-msg" id="modal-msg"></div>
  </div>
</div>

<footer class="footer">
  <div class="container footer-inner">
    <span>Eventra · Prediction Markets</span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="dist/auth.js"></script>
<script src="dist/nav.js"></script>
<script src="dist/events.js"></script>
</body>
</html>
