<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Eventra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
<div class="bg-glow bg-glow-1" aria-hidden="true"></div>
<div class="bg-glow bg-glow-2" aria-hidden="true"></div>

  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Eventra</span>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost" href="react-dist/index.html#/social">Social</a>
        <a id="nav-admin-link" class="btn btn-ghost" href="admin.html" style="display:none;">Admin</a>
        <span id="nav-auth">
          <a class="btn btn-ghost" href="index.html">Home</a>
          <a class="btn btn-primary" href="signup.html">Sign up</a>
        </span>
        <a id="nav-user" href="react-dist/index.html#/account" class="nav-user-chip" style="display:none;" aria-label="Your account">
          <span class="nav-balance" id="nav-balance">$—</span>
          <span class="nav-avatar-pill" id="nav-avatar">?</span>
          <span class="nav-display-name" id="nav-display-name"></span>
        </a>
      </div>
    </nav>
  </header>

  <main class="auth-main" style="min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="sub">Sign in to your Eventra account.</p>

      <form class="auth-form" id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-submit" id="login-btn">Log in</button>
      </form>

      <div class="auth-message" id="login-message" role="alert"></div>
      <p class="auth-footer">
        Don’t have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="dist/auth.js"></script>
  <script src="dist/nav.js"></script>
  <script src="dist/login.js"></script>
</body>
</html>
